<!doctype html>
<!-- ===========================================================================
  檔案名稱：index.html（入口頁）
  檔案版本：v1.0.0（2026-10-25）
  用途說明：
    · 精舍人員：開啟精舍專屬網址（例：…/vihara-platform/?site=TC），以 Google 帳號登入，
      看到自己的身分與可進入的功能。
    · 系統管理員：開啟不帶 ?site 的網址，以 ctw.cloud.service 登入，進入總管理。
  相依檔案：shared/config.js、shared/api.js、shared/auth.js、shared/base.css
=========================================================================== -->
<html lang="zh-Hant-TW">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>精舍雲端服務平台</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="shared/base.css">
  <style>
    /* ── 本頁專屬樣式 ── */

    /* 身分列：問候在左、登出在右 */
    .身分列 {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 1rem;
      flex-wrap: wrap;
      padding-bottom: 1.25rem;
      border-bottom: 1px solid var(--色-線);
    }
    .身分列 p { margin: 0; }
    .角色 { color: var(--色-淡字); }

    /* 功能清單：一列一個功能，以分隔線區分，不做一格一格的卡片 */
    .功能清單 { list-style: none; margin: 0; padding: 0; }
    .功能清單 li { border-bottom: 1px solid var(--色-線); }
    .功能 {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 0.15rem 1rem;
      padding: 1.1rem 0;
      color: inherit;
      text-decoration: none;
    }
    a.功能:hover .功能名稱 { color: var(--色-主); text-decoration: underline; text-underline-offset: 0.25em; }
    .功能名稱 { font-size: 1.125rem; font-weight: 700; }
    .功能說明 { grid-column: 1; color: var(--色-淡字); font-size: 0.9375rem; }
    .功能狀態 { grid-row: 1 / span 2; grid-column: 2; align-self: center; font-size: 0.875rem; color: var(--色-淡字); }
    .功能.未上線 { cursor: default; }
    .功能.未上線 .功能名稱 { color: var(--色-淡字); }
    .清單標題 { margin: 2rem 0 0.25rem; font-size: 0.9375rem; font-weight: 500; color: var(--色-淡字); }
    .空白提示 { padding: 1.1rem 0; color: var(--色-淡字); }

    /* Google 按鈕預留高度，載入時版面不跳動 */
    #google按鈕 { min-height: 44px; }
  </style>
</head>
<body>
  <main class="版面">
    <!-- 匾額：未登入時顯示平台名稱，登入後顯示精舍名稱 -->
    <aside class="匾額">
      <div class="匾額框"><h1 id="匾額文字">精舍雲端服務平台</h1></div>
    </aside>

    <section class="內容" aria-live="polite">
      <!-- 狀態一：確認中 -->
      <p id="區_載入" class="載入中">正在確認登入狀態…</p>

      <!-- 狀態二：需要登入 -->
      <div id="區_登入" hidden>
        <h2>請以 Google 帳號登入</h2>
        <p class="說明" id="登入說明">請使用精舍管理員為您登記的 Google 帳號。</p>
        <div id="google按鈕"></div>
        <p id="登入中" class="載入中" hidden>正在登入…</p>
      </div>

      <!-- 狀態三：已登入 -->
      <div id="區_已登入" hidden>
        <div class="身分列">
          <p><span id="問候"></span>　<span class="角色" id="角色"></span></p>
          <button type="button" class="按鈕" id="登出按鈕">登出</button>
        </div>
        <p class="清單標題" id="功能標題">可使用的功能</p>
        <ul class="功能清單" id="功能清單"></ul>
        <p class="清單標題" id="管理標題" hidden>管理</p>
        <ul class="功能清單" id="管理清單" hidden></ul>
      </div>

      <!-- 錯誤訊息（任何狀態都可能出現） -->
      <p id="訊息" class="訊息" role="alert" hidden></p>
    </section>
  </main>

  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <script src="shared/config.js"></script>
  <script src="shared/api.js"></script>
  <script src="shared/auth.js"></script>
  <script>
    /* =========================================================================
       入口頁程式
       ========================================================================= */

    /* global obj平台設定, 取得網址精舍代號, 設定登入逾時處理, 顯示Google登入按鈕,
              取得我的資訊, 登出平台 */

    // 常用元素
    const el匾額文字 = document.getElementById('匾額文字');
    const el區 = {
      載入: document.getElementById('區_載入'),
      登入: document.getElementById('區_登入'),
      已登入: document.getElementById('區_已登入')
    };
    const el訊息 = document.getElementById('訊息');


    /**
     * 函式名稱：切換狀態  版本：v1.0.0（2026-10-25）
     * 用途：只顯示指定的區塊（載入／登入／已登入）。
     * 參數：str狀態 {string} '載入' | '登入' | '已登入'
     */
    function 切換狀態(str狀態) {
      Object.keys(el區).forEach(function (str鍵) { el區[str鍵].hidden = (str鍵 !== str狀態); });
    }


    /**
     * 函式名稱：顯示訊息  版本：v1.0.0（2026-10-25）
     * 用途：顯示錯誤或一般提醒；傳空字串則隱藏。
     * 參數：
     *   str訊息 {string}
     *   bool一般 {boolean} 選填，true 為一般提醒（例如「已登出」），預設為錯誤樣式
     */
    function 顯示訊息(str訊息, bool一般) {
      el訊息.textContent = str訊息 || '';
      el訊息.hidden = !str訊息;
      el訊息.classList.toggle('一般', Boolean(bool一般));
      el訊息.setAttribute('role', bool一般 ? 'status' : 'alert');
    }


    /**
     * 函式名稱：建立功能列  版本：v1.0.0（2026-10-25）
     * 用途：產生功能清單中的一列。已上線是連結；建置中只顯示文字。
     * 參數：
     *   str名稱 {string} 功能名稱
     *   obj頁面 {Object} { str路徑, str說明, bool已上線 }，沒有對應頁面時為 undefined
     *   str精舍代號 {string} 帶到下一頁的 ?site=
     * 傳回：{HTMLLIElement}
     */
    function 建立功能列(str名稱, obj頁面, str精舍代號) {
      const el列 = document.createElement('li');
      const bool已上線 = Boolean(obj頁面 && obj頁面.bool已上線);
      const el功能 = document.createElement(bool已上線 ? 'a' : 'div');
      el功能.className = '功能' + (bool已上線 ? '' : ' 未上線');
      if (bool已上線) {
        el功能.href = obj頁面.str路徑 + (str精舍代號 ? `?site=${encodeURIComponent(str精舍代號)}` : '');
      }

      const el名稱 = document.createElement('span');
      el名稱.className = '功能名稱';
      el名稱.textContent = str名稱;

      const el說明 = document.createElement('span');
      el說明.className = '功能說明';
      el說明.textContent = (obj頁面 && obj頁面.str說明) || '';

      const el狀態 = document.createElement('span');
      el狀態.className = '功能狀態';
      el狀態.textContent = bool已上線 ? '' : '建置中';

      el功能.append(el名稱, el狀態, el說明);
      el列.appendChild(el功能);
      return el列;
    }


    /**
     * 函式名稱：顯示已登入  版本：v1.0.0（2026-10-25）
     * 用途：依後端回傳的身分與模組，畫出問候、功能清單與管理清單。
     * 參數：obj資訊 {Object} { obj身分, arr模組 }
     */
    function 顯示已登入(obj資訊) {
      const obj身分 = obj資訊.obj身分;
      const bool系統管理員 = obj身分.str角色 === '系統管理員';

      // 匾額與頁籤標題
      el匾額文字.textContent = bool系統管理員 ? '總管理' : obj身分.str精舍名稱;
      document.title = `${el匾額文字.textContent}｜${obj平台設定.str平台名稱}`;

      // 問候
      document.getElementById('問候').textContent = `${obj身分.str姓名 || obj身分.str帳號}，您好`;
      document.getElementById('角色').textContent = obj身分.str角色;

      // 功能清單（精舍已開通的模組）
      const el功能清單 = document.getElementById('功能清單');
      el功能清單.innerHTML = '';
      document.getElementById('功能標題').hidden = bool系統管理員;
      el功能清單.hidden = bool系統管理員;
      if (!bool系統管理員) {
        if (obj資訊.arr模組.length === 0) {
          const el空 = document.createElement('li');
          el空.className = '空白提示';
          el空.textContent = '精舍尚未開通任何功能。請洽精舍管理員。';
          el功能清單.appendChild(el空);
        }
        obj資訊.arr模組.forEach(function (obj模組) {
          el功能清單.appendChild(建立功能列(obj模組.str模組名稱, obj平台設定.obj模組頁面[obj模組.str模組代號], obj身分.str精舍代號));
        });
      }

      // 管理清單（依角色）
      const arr管理 = [];
      if (obj身分.str角色 === '精舍管理員') arr管理.push('精舍設定');
      if (bool系統管理員) arr管理.push('總管理');
      const el管理清單 = document.getElementById('管理清單');
      el管理清單.innerHTML = '';
      arr管理.forEach(function (str名稱) {
        el管理清單.appendChild(建立功能列(str名稱, obj平台設定.obj管理頁面[str名稱], obj身分.str精舍代號));
      });
      el管理清單.hidden = arr管理.length === 0;
      document.getElementById('管理標題').hidden = arr管理.length === 0 || bool系統管理員;

      切換狀態('已登入');
    }


    /**
     * 函式名稱：顯示登入  版本：v1.0.0（2026-10-25）
     * 用途：切到登入畫面並畫出 Google 登入按鈕。
     * 參數：
     *   str提醒 {string} 選填，例如「登入已逾時，請重新登入。」
     *   bool一般 {boolean} 選填，true 表示提醒不是錯誤（例如「已登出」）
     */
    function 顯示登入(str提醒, bool一般) {
      el匾額文字.textContent = obj平台設定.str平台名稱;
      document.title = obj平台設定.str平台名稱;
      document.getElementById('登入說明').textContent = 取得網址精舍代號()
        ? '請使用精舍管理員為您登記的 Google 帳號。'
        : '這是系統管理員的入口。精舍人員請改用精舍的專屬網址登入。';
      document.getElementById('登入中').hidden = true;
      顯示訊息(str提醒 || '', bool一般);
      切換狀態('登入');

      顯示Google登入按鈕(
        document.getElementById('google按鈕'),
        function 成功(obj結果) {
          顯示訊息('');
          // 登入回應已含身分；模組清單另外取一次
          取得我的資訊().then(顯示已登入).catch(function (err) { 顯示登入(err.str訊息); });
        },
        function 失敗(err) {
          document.getElementById('登入中').hidden = true;
          顯示訊息(err.str訊息 || err.message);
        },
        function 處理中() {
          顯示訊息('');
          document.getElementById('登入中').hidden = false;
        }
      );
    }


    /**
     * 函式名稱：啟動入口頁  版本：v1.0.0（2026-10-25）
     * 用途：開頁時先用保存的代碼確認身分；沒有或已逾時就顯示登入。
     */
    async function 啟動入口頁() {
      // 任何請求遇到登入逾時，都回到登入畫面
      設定登入逾時處理(function (str訊息) { 顯示登入(str訊息); });

      // 登出
      document.getElementById('登出按鈕').addEventListener('click', async function () {
        this.disabled = true;
        await 登出平台();
        this.disabled = false;
        顯示登入('已登出。', true);
      });

      切換狀態('載入');
      try {
        const obj資訊 = await 取得我的資訊();
        if (obj資訊) {
          顯示已登入(obj資訊);
        } else {
          顯示登入();
        }
      } catch (err) {
        // 登入逾時已由處理函式切回登入畫面；其他錯誤顯示訊息並讓使用者重新登入
        if (err.str錯誤代碼 !== 'SESSION_EXPIRED') 顯示登入(err.str訊息 || err.message);
      }
    }

    啟動入口頁();
  </script>
</body>
</html>
