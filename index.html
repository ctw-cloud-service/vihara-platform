<!doctype html>
<!-- ===========================================================================
  檔案名稱：index.html（根目錄轉址頁）
  檔案版本：v1.0.0（2026-10-25）
  用途說明：
    各模組都放在自己的頂層資料夾，入口頁在 core/。
    本頁只負責把 …/vihara-platform/?site=TC 轉到 …/vihara-platform/core/?site=TC，
    讓發給各精舍的網址保持簡短，網址上的精舍代號會一併帶過去。
=========================================================================== -->
<html lang="zh-Hant-TW">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>精舍雲端服務平台</title>
  <script>
    // 保留 ?site= 等參數，以 replace 轉址（按上一頁不會回到這個空白頁）
    window.location.replace('core/' + window.location.search);
  </script>
</head>
<body>
  <!-- 瀏覽器停用 JavaScript 時的備用連結 -->
  <p><a href="core/">前往精舍雲端服務平台</a></p>
</body>
</html>
